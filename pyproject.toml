[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpls-copilot"
version = "1.0.0"
description = "Air-Gapped Predictive Copilot & Telemetry Simulator for Secure MPLS Operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netcopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
